rules:
  - id: no-dynamic-code
    languages: [javascript]
    message: No ejecutar código dinámico con eval o Function.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: no-shell-exec
    languages: [javascript]
    message: Evitar ejecución de shell. Usar execFile con argumentos separados.
    severity: ERROR
    pattern-either:
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
  - id: no-disabled-tls
    languages: [javascript]
    message: No deshabilitar la validación TLS.
    severity: ERROR
    pattern-either:
      - pattern: 'process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"'
      - pattern: '{rejectUnauthorized: false, ...}'
  - id: no-hardcoded-credential
    languages: [javascript]
    message: Las credenciales deben provenir de un gestor de secretos.
    severity: ERROR
    patterns:
      - pattern: const $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(password|api_key|secret_token).*
