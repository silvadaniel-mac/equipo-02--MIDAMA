openapi: 3.0.3
info:
  title: SaaS Colegios Multitenant API
  version: 1.0.0
  description: 'API principal para gestión de contenido, notas y apoderados en colegios.'
paths:
  '/api/v1/schools/{schoolId}/courses/{courseId}/content':
    get:
      summary: Listar contenido del curso
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de contenidos obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContentResponse'
        '404':
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Subir contenido educativo (Profesor)
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentInput'
            example:
              title: Guía de Álgebra N°1
              description: Ejercicios prácticos de ecuaciones cuadráticas.
              fileUrl: 'https://storage.colegio.cl/guias/algebra-1.pdf'
      responses:
        '201':
          description: Contenido creado exitosamente
        '400':
          description: Error de validación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/api/v1/schools/{schoolId}/students/{studentId}/grades':
    get:
      summary: Consultar notas del estudiante
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notas obtenidas correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GradeResponse'
        '404':
          description: Estudiante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Registrar nota (Profesor)
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeInput'
            example:
              subject: Matemáticas
              score: 6.5
              weight: 0.3
              comment: Excelente desempeño en la prueba.
      responses:
        '201':
          description: Nota registrada
        '400':
          description: Solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  '/api/v1/schools/{schoolId}/students/{studentId}/reports':
    get:
      deprecated: true
      summary: Obtener informe de rendimiento para apoderados
      parameters:
        - name: schoolId
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Informe generado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  studentName:
                    type: string
                  generalAverage:
                    type: number
                  attendancePercentage:
                    type: number
                example:
                  studentName: Lucas Riquelme
                  generalAverage: 6.2
                  attendancePercentage: 94.5
        '404':
          description: Estudiante o reporte no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
security:
  - bearerAuth: []
components:
  schemas:
    ContentInput:
      type: object
      required:
        - title
        - fileUrl
      properties:
        title:
          type: string
        description:
          type: string
        fileUrl:
          type: string
    ContentResponse:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    GradeInput:
      type: object
      required:
        - subject
        - score
      properties:
        subject:
          type: string
        score:
          type: number
        weight:
          type: number
        comment:
          type: string
    GradeResponse:
      type: object
      properties:
        id:
          type: string
        subject:
          type: string
        score:
          type: number
        date:
          type: string
          format: date
    ErrorResponse:
      type: object
      description: Estándar RFC 7807 para problemas en APIs HTTP
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          uri: 'https://api.colegios.cl/errors/bad-request'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      example:
        type: 'https://api.colegios.cl/errors/not-found'
        title: Recurso no encontrado
        status: 404
        detail: El estudiante no pertenece al colegio especificado.
        instance: /api/v1/schools/sch_01/students/1234/grades
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT