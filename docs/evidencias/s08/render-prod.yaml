apiVersion: v1
kind: Namespace
metadata:
  name: aulaviva-prod
---
apiVersion: v1
kind: Service
metadata:
  name: aulaviva-api
  namespace: aulaviva-prod
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: aulaviva-api
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: aulaviva-api
  name: aulaviva-api
  namespace: aulaviva-prod
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: aulaviva-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: aulaviva-api
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: ENABLE_LAB_LOAD
          value: "false"
        image: ghcr.io/silvadaniel-mac/aulaviva-api:bootstrap
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
