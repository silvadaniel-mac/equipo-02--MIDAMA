extends: spectral:oas
rules:
  operation-summary-required:
    description: Cada operación debe tener summary.
    given: "$.paths.*[get,post,put,delete,patch,options,head,trace]"
    severity: error
    then:
      field: summary
      function: truthy
  paths-kebab-case:
    description: Rutas con segmentos kebab-case y parámetros nombrados.
    given: "$.paths.*~"
    severity: error
    then:
      function: pattern
      functionOptions:
        match: '^(/([a-z0-9]+(-[a-z0-9]+)*|\{[a-zA-Z][a-zA-Z0-9]*\}))+$'
