apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aulaviva-dev
  namespace: argocd
spec:
  project: aulaviva
  source:
    repoURL: https://github.com/miguelbriceno-sys/equipo-02-gitops.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: aulaviva-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
