apiVersion: apps/v1
kind: Deployment
metadata:
  name: aulaviva-api
  namespace: equipo-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aulaviva-api
  template:
    metadata:
      labels:
        app: aulaviva-api
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: IMAGE_BY_DIGEST
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aulaviva-api
  namespace: equipo-02
spec:
  selector:
    app: aulaviva-api
  ports:
    - port: 80
      targetPort: 8080
