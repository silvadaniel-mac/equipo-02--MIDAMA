apiVersion: batch/v1
kind: Job
metadata:
  name: aulaviva-load
  namespace: equipo-02
spec:
  activeDeadlineSeconds: 360
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: aulaviva-api:local
          imagePullPolicy: IfNotPresent
          command: [/nodejs/bin/node, --input-type=module, -e]
          args:
            - |
              const stop = Date.now() + 300000;
              let errors = 0;
              await Promise.all(Array.from({length: 12}, async () => {
                while (Date.now() < stop) {
                  try {
                    const r = await fetch('http://aulaviva-api/lab/work', {signal: AbortSignal.timeout(5000)});
                    await r.arrayBuffer();
                    if (!r.ok) errors++;
                  } catch { errors++; }
                }
              }));
              console.log(JSON.stringify({errors}));
              if (errors) process.exit(1);
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
